name: Release

# GOTCHA: GitHub Actions silently skips this workflow when the head
# commit message contains the canonical CI-skip token (the bracketed
# phrase "skip" + "ci") ANYWHERE in the message — title or body,
# inside backticks, inside code blocks, doesn't matter. The
# semantic-release release commit emits that token by design (so its
# own commit doesn't loop a release back through CI). Side effect:
# any PR that DESCRIBES that release commit verbatim in its body
# inherits the token through the squash-merge and silently skips
# the next release.
#
# When writing a commit message or PR body that needs to reference
# the suppression behaviour, refer to it descriptively (e.g. "the
# semantic-release skip token") instead of pasting the literal.
#
# Recover with a no-op commit whose entire message — title and body
# — does NOT contain the literal token.
#
# References:
#  - https://docs.github.com/en/actions/managing-workflow-runs/skipping-workflow-runs

# GOTCHA: commit-analyzer (.releaserc.json) scans the ENTIRE squash-merge
# commit message — not just its first line — for `!` breaking markers and
# `BREAKING CHANGE:` footers. PR #409 squash-merged with the repo's old
# squash setting (title + every individual commit message concatenated into
# the body); two intermediate WIP commits on that branch used `feat!:`/
# `BREAKING CHANGE:` before the design settled, and those survived into the
# squash body even though the PR's own title was a plain `feat:`. Result: an
# accidental blocks-v8.0.0 major release (git tag, GitHub Release, and real
# `npm publish` for all 5 packages) instead of the intended 7.x minor.
#
# Fixed at the repo-settings level, not here: squash_merge_commit_message is
# now PR_BODY (was COMMIT_MESSAGES) and squash_merge_commit_title is
# PR_TITLE, so the commit landing on main — the one this workflow's
# commit-analyzer sees — is only ever the PR title + PR description, never
# per-commit WIP diary text. A deliberate breaking change still works: state
# it once, directly in the PR description.
#
# commit-analyzer has no per-commit override (it can't be told "ignore this
# one historical commit's BREAKING CHANGE"), so if this setting is ever
# reverted, the fix is repo Settings > General > Pull Requests, or
# `gh api -X PATCH repos/decocms/blocks -f squash_merge_commit_message=PR_BODY`.

on:
  push:
    # 7.x is the maintenance line of the v7 packages since v8 took main.
    # It releases all 17 lockstep @decocms/* packages under the same
    # blocks-v*.*.* tags, within 7.x (.releaserc.json). @decocms/blocks,
    # the tanstack and nextjs bindings and the apps v8 also ships (algolia,
    # magento, resend, shopify, vtex, wake) publish on the `latest-7`
    # dist-tag, because their `latest` is 8.x (the bindings' from 8.3.0); the
    # v7-only packages (blocks-admin, blocks-cli, eitri,
    # apps-commerce/-blog/-website/-salesforce/-nuvemshop) keep `latest`.
    # npm refuses a dist-tag that parses as a semver range, so it can't be
    # `7.x` or `v7`.
    #
    # Publishing goes through npm Trusted Publishing (OIDC): each package
    # names this workflow FILE (release.yml) as its trusted publisher on
    # npmjs.com, so keep the file name. The "Release" step's id-token
    # permission lets `npm publish` exchange a GitHub OIDC token for a
    # short-lived npm auth token at publish time. No stored npm token.
    #
    # History: this line developed on the `v7` branch (tag seed blocks-v7.0.0
    # via a manual bootstrap publish) until PR #315 merged it into main, and
    # released from main until v8 merged there (seed blocks-v8.0.0); the
    # legacy single-package @decocms/start line (v*.*.* tags) is retired —
    # its tags remain in the repo but nothing releases or advances them.
    branches: [7.x]
  # Manual escape hatch to verify what a release WOULD do without publishing,
  # tagging, or opening a GitHub release. Run from the Actions tab.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — compute and log the release, but don't publish, tag, or open a GitHub release"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - run: bun install --frozen-lockfile

      # npm Trusted Publishing (OIDC) requires npm >=11.5.1 to perform the
      # OIDC token exchange. Node 22's bundled npm is older than that.
      # Pinned to the 11.x major, NOT @latest: npm 12.0.0 (released
      # 2026-07-08T21:06Z) ships with a broken libnpmpublish provenance path
      # ("Cannot find module 'sigstore'"), which killed two release runs the
      # evening it came out. Bump deliberately after verifying `npm publish`
      # works on the new major.
      - run: npm install -g npm@11

      # GOTCHA: semantic-release's --dry-run ONLY skips its own native git-tag
      # creation step (lib/index.js: `if (options.dryRun) { skip tag } else {
      # tag, push, ... }`). It calls `plugins.prepare(context)` and
      # `plugins.publish(context)` UNCONDITIONALLY either way, and
      # @semantic-release/exec's prepare/publish hooks don't check dry-run
      # themselves — they just run prepareCmd/publishCmd as configured. So a
      # naive exec-based publishCmd WOULD attempt a real `npm publish` even
      # during a "dry run". .releaserc.json's publishCmd checks $DRY_RUN
      # itself to guard against this — verified empirically (confirmed real
      # publish was never reached only because npm auth wasn't configured;
      # this DRY_RUN check is the actual, reliable guard).
      - name: Release
        run: ./node_modules/.bin/semantic-release${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && ' --dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'true' || 'false' }}

